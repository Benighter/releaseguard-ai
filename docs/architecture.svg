<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ReleaseGuard AI architecture</title>
  <desc id="desc">Alexa+ or another MCP client calls ReleaseGuard over Streamable HTTP. Bounded tools run build, API and Playwright checks. A deterministic policy produces SHIP, REVIEW or HOLD, while Amazon Bedrock optionally writes a grounded narrative.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172a42"/><stop offset="1" stop-color="#08101a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#83c0ff"/><stop offset="1" stop-color="#65d68a"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#6f8fb4"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="100" y="105" fill="#f6f4ed" font-family="Arial, sans-serif" font-size="54" font-weight="800">ReleaseGuard AI</text>
  <text x="100" y="157" fill="#9fb0c3" font-family="Arial, sans-serif" font-size="25">Evidence enters once. Every recommendation remains traceable.</text>
  <g stroke="#6f8fb4" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M355 350 H465"/><path d="M790 350 H900"/><path d="M1215 350 H1325"/><path d="M1050 480 V590"/>
  </g>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="90" y="250" width="265" height="200" rx="28" fill="#132235" stroke="#345170" stroke-width="2"/>
    <text x="222" y="320" text-anchor="middle" fill="#83c0ff" font-size="24" font-weight="700">Alexa+ / MCP client</text>
    <text x="222" y="367" text-anchor="middle" fill="#f6f4ed" font-size="21">“Is 2.8 safe to release?”</text>
    <text x="222" y="407" text-anchor="middle" fill="#91a4b9" font-size="17">MCP 2025-11-25+</text>

    <rect x="465" y="225" width="325" height="250" rx="28" fill="#12283a" stroke="#5598d4" stroke-width="2"/>
    <text x="627" y="294" text-anchor="middle" fill="#83c0ff" font-size="24" font-weight="700">Streamable HTTP</text>
    <text x="627" y="343" text-anchor="middle" fill="#f6f4ed" font-size="20">assess_release</text>
    <text x="627" y="382" text-anchor="middle" fill="#f6f4ed" font-size="20">run_demo_release</text>
    <text x="627" y="425" text-anchor="middle" fill="#91a4b9" font-size="17">Origin and target allowlists</text>

    <rect x="900" y="210" width="315" height="280" rx="28" fill="#172235" stroke="#455b76" stroke-width="2"/>
    <text x="1057" y="275" text-anchor="middle" fill="#f6f4ed" font-size="25" font-weight="700">Bounded runner</text>
    <text x="1057" y="326" text-anchor="middle" fill="#65d68a" font-size="20">Compiled artifact</text>
    <text x="1057" y="365" text-anchor="middle" fill="#65d68a" font-size="20">API contract</text>
    <text x="1057" y="404" text-anchor="middle" fill="#65d68a" font-size="20">Playwright journey</text>
    <text x="1057" y="445" text-anchor="middle" fill="#91a4b9" font-size="17">Timeouts · logs · screenshots</text>

    <rect x="1325" y="250" width="190" height="200" rx="28" fill="#142c27" stroke="#3e8e69" stroke-width="2"/>
    <text x="1420" y="318" text-anchor="middle" fill="#65d68a" font-size="24" font-weight="800">SHIP</text>
    <text x="1420" y="360" text-anchor="middle" fill="#f8bc53" font-size="24" font-weight="800">REVIEW</text>
    <text x="1420" y="402" text-anchor="middle" fill="#ff6b6b" font-size="24" font-weight="800">HOLD</text>

    <rect x="890" y="590" width="335" height="175" rx="28" fill="#241c31" stroke="#80659e" stroke-width="2"/>
    <text x="1057" y="655" text-anchor="middle" fill="#d7b8ff" font-size="24" font-weight="700">Amazon Bedrock</text>
    <text x="1057" y="699" text-anchor="middle" fill="#f6f4ed" font-size="19">Optional grounded narrative</text>
    <text x="1057" y="735" text-anchor="middle" fill="#91a4b9" font-size="16">The deterministic gate owns the verdict</text>
  </g>
  <rect x="90" y="815" width="1425" height="4" rx="2" fill="url(#accent)"/>
</svg>
